# Local PostgreSQL for development: `docker compose up -d`, then run the app with the default DATABASE_URL.
# Creates both the app database (aureus) and the test database (aureus_test).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust  # local development only
      POSTGRES_DB: aureus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pg-data:
