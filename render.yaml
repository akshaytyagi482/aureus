# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# Secrets marked `sync: false` are asked for when the Blueprint is created.
envVarGroups:
  - name: aureus-shared
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AUREUS_ENV
        value: production
      - key: AUREUS_MASTER_KEY  # python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
        sync: false
      - key: APP_BASE_URL       # https://<your-domain>, used in emailed links
        sync: false
      - key: SMTP_HOST          # e.g. smtp.resend.com / smtp.sendgrid.net / email-smtp.ap-south-1.amazonaws.com
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM          # e.g. AureusRecon <alerts@yourdomain.in>
        sync: false
      - key: GEMINI_API_KEY     # optional: AI features (assistant, notice reader, HSN fixer, supplier matcher)
        sync: false
      - key: AUREUS_AI_TIER     # "free" masks client names/GSTINs and asks before sending notices; "paid" once billing is on
        value: free
      - key: ANTHROPIC_API_KEY  # optional: Claude polishes notice replies when no Gemini key is set
        sync: false
      - key: ZOHO_CLIENT_ID     # optional: Zoho Books one-click connect
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REDIRECT_URI  # https://<your-domain>/api/integrations/zoho/callback
        sync: false

services:
  - type: web
    name: aureusrecon
    runtime: python
    region: singapore  # nearest Render region to India
    plan: starter      # free instances sleep after 15 minutes idle; use starter or above for real clients
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn aureus.api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - fromGroup: aureus-shared
      - key: DATABASE_URL
        fromDatabase:
          name: aureusrecon-db
          property: connectionString

  - type: cron
    name: aureusrecon-daily
    runtime: python
    region: singapore
    schedule: "30 2 * * *"  # 08:00 IST: Zoho re-sync, GSTR-3B deadline alerts, consent expiry warnings
    buildCommand: pip install -r requirements.txt
    startCommand: python -m aureus.jobs daily
    envVars:
      - fromGroup: aureus-shared
      - key: DATABASE_URL
        fromDatabase:
          name: aureusrecon-db
          property: connectionString

# Managed PostgreSQL. To keep data in India instead, delete this block and set DATABASE_URL
# to a Mumbai-hosted Postgres (e.g. AWS RDS ap-south-1 or Supabase South Asia) in both services.
databases:
  - name: aureusrecon-db
    region: singapore
    plan: 0.1c-256mb  # smallest paid instance; Render's free Postgres expires, so avoid it for real data
    databaseName: aureus
    postgresMajorVersion: "16"
    ipAllowList: []  # only Render services in this account can connect
